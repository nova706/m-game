<!DOCTYPE html>
<html lang="en">
<head>

    <title>Stickman Clash: 3-Player Supreme Edition</title>

    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <p class="info">

        Menu Navigation: <strong>Left Stick / D-Pad</strong> to highlight | <strong>(A) Button</strong> to select<br>

    </p>
    <script>

        var playerWins = 0, botWins = 0;

            { name: "Rogue Shadow", primary: "#4e5d6c", headColor: "#c5c6c7", symbol: "ninja" }, { name: "Emerald Jade", primary: "#2ec4b6", headColor: "#e0fbfc", symbol: "leaf" },
            { name: "Void Stalker", primary: "#7209b7", headColor: "#f72585", symbol: "skull" }, { name: "Royal Gold", primary: "#ffb703", headColor: "#fff", symbol: "crown" }

        function processControllerMenus() {
            var pads = navigator.getGamepads ? navigator.getGamepads() : [];

        function startGameSession() {

            p2.color = skinOptions[p2SkinIndex].primary; p2.headColor = skinOptions[p2SkinIndex].headColor;
            p3.color = skinOptions[p3SkinIndex].primary; p3.headColor = skinOptions[p3SkinIndex].headColor;

            p2.x = 650; p2.y = 100; p2.vx = 0; p2.vy = 0; p2.facingLeft = true; p2.hp = 200; p2.charge = 0; p2.comboState = "none";
            p3.x = 400; p3.y = 80;  p3.vx = 0; p3.vy = 0; p3.facingLeft = false; p3.hp = 200; p3.charge = 0; p3.comboState = "none";
            projectiles = []; hitParticles = []; globalShakeIntensity = 0; roundTimer = 60; lastTimeCheck = Date.now(); isSuddenDeath = false; missileTimer = 0;
            randomizeWeapons(); currentScene = "playing";
        }
        function randomizeWeapons() { p1.weapon = weaponPool[Math.floor(Math.random() * 4)]; p2.weapon = weaponPool[Math.floor(Math.random() * 4)]; p3.weapon = weaponPool[Math.floor(Math.random() * 4)]; }
        function checkPlatformFloor(char) {
            var feetY = char.y, oldFeetY = char.y - char.vy;
            for (var i = 0; i < platforms.length; i++) {
                var plat = platforms[i];
                if (char.x + 10 > plat.x && char.x - 10 < plat.x + plat.w) {
                    if (oldFeetY <= plat.y && feetY >= plat.y) { char.y = plat.y; char.vy = 0; if (char.isJumping) char.landTimer = 5; char.isJumping = false; return; }
                }

            char.isJumping = true;
        }
        function spawnHitExplosion(x, y, color, amount) {
            for (var i = 0; i < amount; i++) { hitParticles.push({ x: x, y: y, vx: (Math.random() - 0.5) * 7, vy: (Math.random() - 0.5) * 7, radius: Math.random() * 3 + 2, color: color, life: Math.random() * 15 + 10 }); }
        }
        function processFighterInputs() {
            var pads = navigator.getGamepads ? navigator.getGamepads() : [];

                if (pads[0].buttons[0].pressed) { if (!p1Pressed.jump && !p1.isJumping && p1.landTimer === 0) { p1.vy = -13; p1.isJumping = true; } p1Pressed.jump = true; } else p1Pressed.jump = false;
                if (pads[0].buttons[2].pressed) { if (!p1Pressed.attack && p1.attackTimer === 0) useWeaponAttack(p1); p1Pressed.attack = true; } else p1Pressed.attack = false;
                if (pads[0].buttons[3].pressed) { if (!p1Pressed.ult && p1.charge >= 100) useUltimateBlast(p1); p1Pressed.ult = true; } else p1Pressed.ult = false;
            } else {
                if (keys["KeyA"]) { p1.vx = -4.5; p1.facingLeft = true; p1.walkCycle += 0.22; } else if (keys["KeyD"]) { p1.vx = 4.5; p1.facingLeft = false; p1.walkCycle += 0.22; } else p1.vx = 0;
                if (keys["KeyW"] && !p1.isJumping && p1.landTimer === 0) { p1.vy = -13; p1.isJumping = true; } if (keys["KeyS"] && p1.attackTimer === 0) useWeaponAttack(p1); if (keys["KeyE"] && p1.charge >= 100) useUltimateBlast(p1);
            }
            if (pads && pads[1] && gameMode !== "solo") {
                var s2X = pads[1].axes[0]; if (Math.abs(s2X) > 0.2) { p2.vx = s2X * 4.5; p2.facingLeft = s2X < 0; p2.walkCycle += 0.22; } else p2.vx = 0;
                if (pads[1].buttons[0].pressed) { if (!p2Pressed.jump && !p2.isJumping) { p2.vy = -13; p2.isJumping = true; } p2Pressed.jump = true; } else p2Pressed.jump = false;
                if (pads[1].buttons[2].pressed) { if (!p2Pressed.attack && p2.attackTimer === 0) useWeaponAttack(p2); p2Pressed.attack = true; } else p2Pressed.attack = false;
                if (pads[1].buttons[3].pressed) { if (!p2Pressed.ult && p2.charge >= 100) useUltimateBlast(p2); p2Pressed.ult = true; } else p2Pressed.ult = false;
            } else if (gameMode !== "solo") {
                if (keys["ArrowLeft"]) { p2.vx = -4.5; p2.facingLeft = true; p2.walkCycle += 0.22; } else if (keys["ArrowRight"]) { p2.vx = 4.5; p2.facingLeft = false; p2.walkCycle += 0.22; } else p2.vx = 0;
                if (keys["ArrowUp"] && !p2.isJumping && p2.landTimer === 0) { p2.vy = -13; p2.isJumping = true; } if (keys["ArrowDown"] && p2.attackTimer === 0) useWeaponAttack(p2); if (keys["Space"] && p2.charge >= 100) useUltimateBlast(p2);
            }
            if (pads && pads[2] && gameMode === "triple") {
                var s3X = pads[2].axes[0]; if (Math.abs(s3X) > 0.2) { p3.vx = s3X * 4.5; p3.facingLeft = s3X < 0; p3.walkCycle += 0.22; } else p3.vx = 0;
                if (pads[2].buttons[0].pressed) { if (!p3Pressed.jump && !p3.isJumping) { p3.vy = -13; p3.isJumping = true; } p3Pressed.jump = true; } else p3Pressed.jump = false;
                if (pads[2].buttons[2].pressed) { if (!p3Pressed.attack && p3.attackTimer === 0) useWeaponAttack(p3); p3Pressed.attack = true; } else p3Pressed.attack = false;
                if (pads[2].buttons[3].pressed) { if (!p3Pressed.ult && p3.charge >= 100) useUltimateBlast(p3); p3Pressed.ult = true; } else p3Pressed.ult = false;
            } else if (gameMode === "triple") {
                if (keys["KeyJ"]) { p3.vx = -4.5; p3.facingLeft = true; p3.walkCycle += 0.22; } else if (keys["KeyL"]) { p3.vx = 4.5; p3.facingLeft = false; p3.walkCycle += 0.22; } else p3.vx = 0;
                if (keys["KeyI"] && !p3.isJumping && p3.landTimer === 0) { p3.vy = -13; p3.isJumping = true; } if (keys["KeyK"] && p3.attackTimer === 0) useWeaponAttack(p3); if (keys["KeyU"] && p3.charge >= 100) useUltimateBlast(p3);
            }
        }
        function useWeaponAttack(attacker) {
            attacker.attackTimer = (attacker.weapon === "gauntlets") ? 6 : 18;
            var enemies = [p1, p2, p3].filter(p => p !== attacker && (gameMode === "triple" || p !== p3));
            if (attacker.weapon === "axe" || attacker.weapon === "crossbow") {
                var speed = (attacker.weapon === "axe") ? 8 : 14;
                projectiles.push({ x: attacker.facingLeft ? attacker.x - 20 : attacker.x + 20, y: attacker.y - 16, vx: attacker.facingLeft ? -speed : speed, type: attacker.weapon, owner: attacker, angle: 0 });
            } else {
                var reach = (attacker.weapon === "sword") ? 50 : 25, dmg = (attacker.weapon === "sword") ? 20 : 8;
                var hitX = attacker.facingLeft ? attacker.x - reach : attacker.x + reach;
                enemies.forEach(victim => {
                    if (victim.hp > 0 && Math.abs(hitX - victim.x) < (reach + 15) && Math.abs(attacker.y - victim.y) < 45) {
                        victim.hp -= dmg; attacker.charge = Math.min(100, attacker.charge + 15); hitstopTimer = 4; globalShakeIntensity = 8; spawnHitExplosion(victim.x, victim.y - 20, attacker.color, 10);
                        victim.vx = attacker.facingLeft ? -10 : 10; victim.vy = -3;
                    }
                });
            }
        }
        function useUltimateBlast(attacker) { attacker.charge = 0; attacker.ultActive = 25; projectiles.push({ x: attacker.facingLeft ? attacker.x - 30 : attacker.x + 30, y: attacker.y - 18, vx: attacker.facingLeft ? -16 : 16, type: "ultimate", owner: attacker, angle: 0 }); }
        function updateGame() {
            if (hitstopTimer > 0) { hitstopTimer--; return; } var now = Date.now();
            if (now - lastTimeCheck >= 1000) { lastTimeCheck = now; if (roundTimer > 0) roundTimer--; else isSuddenDeath = true; }
            if (isSuddenDeath && ++missileTimer % 35 === 0) { projectiles.push({ x: Math.random() * 760 + 20, y: -10, vx: (Math.random() - 0.5) * 3, vy: 5, type: "missile", owner: null, angle: Math.PI / 2 }); }
            if (selectedMapIndex === 1 || selectedMapIndex === 2) { [p1, p2, p3].forEach(p => { if ((Math.abs(p.x - 100) < 30 || Math.abs(p.x - 700) < 30) && p.y > 340) { p.vy = -18; p.isJumping = true; spawnHitExplosion(p.x, 355, "#66fcf1", 4); } }); }
            if (selectedMapIndex === 1) { [p1, p2, p3].forEach(p => { if (p.y >= 360 && (gameMode === "triple" || p !== p3)) p.hp -= 0.75; }); }
            processFighterInputs(); var activeRoster = gameMode === "triple" ? [p1, p2, p3] : [p1, p2];

            if (gameMode === "solo" && p2.hp > 0) {

                if (selectedMapIndex === 1 && p2.y > 330) { p2.vx = p2.x < 400 ? 3.5 : -3.5; if (!p2.isJumping && Math.random() < 0.2) { p2.vy = -12; p2.isJumping = true; } } 
                else { p2.vx = Math.abs(dx) > prefDist + 15 ? (dx > 0 ? 2.8 : -2.8) : 0; p2.facingLeft = dx < 0; if (p1.y < p2.y - 45 && !p2.isJumping && Math.random() < 0.04) { p2.vy = -13; p2.isJumping = true; } }

                var botCanAttack = (p2.weapon === "axe" || p2.weapon === "crossbow") ? (Math.abs(p1.y - p2.y) < 40 && Math.random() < 0.04) : (Math.abs(dx) < prefDist + 10 && Math.random() < 0.15);
                if (botCanAttack && p2.attackTimer === 0) useWeaponAttack(p2);
            }

                var targets = [p1, p2, p3].filter(p => p !== pr.owner && p.hp > 0 && (gameMode === "triple" || p !== p3)); var hit = false;
                for (var t = 0; t < targets.length; t++) {
                    var tar = targets[t]; var hz = pr.type === "ultimate" ? 35 : 22;
                    if (Math.abs(pr.x - tar.x) < hz && Math.abs(pr.y - (tar.y - 18)) < hz) {
                        tar.hp -= pr.type === "ultimate" ? 40 : pr.type === "missile" ? 30 : 12; if (pr.owner) pr.owner.charge = Math.min(100, pr.owner.charge + 12);
                        tar.vx = pr.vx > 0 ? 12 : -12; tar.vy = -4; globalShakeIntensity = 12; hitstopTimer = 3; spawnHitExplosion(tar.x, tar.y - 18, pr.type === "missile" ? "#ff3333" : pr.type === "ultimate" ? "#66fcf1" : pr.owner.color, 12);
                        projectiles.splice(i, 1); hit = true; break;

        }
        function drawHUD() {

            ctx.fillStyle = isSuddenDeath ? "#ff3333" : "#66fcf1"; ctx.font = "bold 18px sans-serif"; ctx.textAlign = "center"; ctx.fillText(isSuddenDeath ? "SUDDEN DEATH!" : roundTimer, 400, 24);
        }
        function drawSkinArtSymbol(x, y, type, color) {
            ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3;
            if (type === "neon") { ctx.strokeRect(x - 10, y - 10, 20, 20); } else if (type === "fire") { ctx.beginPath(); ctx.moveTo(x, y - 12); ctx.lineTo(x + 8, y + 2); ctx.lineTo(x - 8, y + 2); ctx.fill(); } else if (type === "ninja") { ctx.fillRect(x - 12, y - 4, 24, 8); ctx.fillRect(x - 4, y - 12, 8, 24); } else if (type === "leaf") { ctx.beginPath(); ctx.ellipse(x, y, 6, 12, Math.PI / 4, 0, Math.PI * 2); ctx.fill(); } else if (type === "skull") { ctx.beginPath(); ctx.arc(x, y - 4, 8, 0, Math.PI, true); ctx.fill(); } else if (type === "crown") { ctx.beginPath(); ctx.moveTo(x - 12, y + 8); ctx.lineTo(x - 12, y - 8); ctx.lineTo(x, y - 10); ctx.lineTo(x + 12, y - 8); ctx.lineTo(x + 12, y + 8); ctx.fill(); }
            ctx.restore();
        }
        function drawStickman(char) {
            if (char.hp <= 0) return; ctx.strokeStyle = char.color; ctx.lineWidth = 5; ctx.lineCap = "round"; var scaleX = 1.0, scaleY = 1.0; if (char.landTimer > 0) { scaleY = 0.75; scaleX = 1.25; } else if (char.isJumping) { var str = Math.min(0.3, Math.abs(char.vy) * 0.03); scaleY = 1.0 + str; scaleX = 1.0 - (str * 0.5); }
            ctx.save(); ctx.translate(char.x, char.y); if (char.comboState === "hurricane") { ctx.rotate(Date.now() * 0.05); } ctx.scale(scaleX, scaleY); ctx.beginPath(); ctx.arc(0, -32, 8, 0, Math.PI * 2); ctx.stroke(); ctx.fillStyle = char.headColor; ctx.beginPath(); ctx.arc(char.facingLeft ? -3 : 3, -32, 1.5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.moveTo(0,-24); ctx.lineTo(0,0); ctx.stroke(); var legWobble = Math.sin(char.walkCycle) * 10; ctx.beginPath(); if (char.isJumping) { ctx.moveTo(0,0); ctx.lineTo(-6,12); ctx.moveTo(0,0); ctx.lineTo(6,8); } else { ctx.moveTo(0,0); ctx.lineTo(legWobble,15); ctx.moveTo(0,0); ctx.lineTo(-legWobble,15); } ctx.stroke(); var handX = char.facingLeft ? -16 : 16, handY = char.attackTimer > 0 ? -4 : -16; ctx.beginPath(); ctx.moveTo(0,-16); ctx.lineTo(handX, handY); ctx.stroke(); ctx.save(); ctx.translate(handX, handY);
            if (char.weapon === "axe" && char.attackTimer === 0) { ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -14); ctx.stroke(); ctx.fillStyle = char.color; ctx.fillRect(-4, -18, 8, 6); } else if (char.weapon === "sword") { var sAngle = char.facingLeft ? Math.PI * 1.1 : -Math.PI * 0.1; if (char.attackTimer > 0) sAngle = char.facingLeft ? Math.PI * 0.6 : Math.PI * 0.4; ctx.rotate(sAngle); ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(32, 0); ctx.stroke(); } else if (char.weapon === "crossbow") { ctx.strokeStyle = "#8b5a2b"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(char.facingLeft ? -10 : 10, 0); ctx.stroke(); } else if (char.weapon === "gauntlets") { ctx.fillStyle = "#66fcf1"; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill(); }
            ctx.restore(); ctx.fillStyle = "#fff"; ctx.font = "9px sans-serif"; ctx.textAlign = "center"; ctx.fillText(char.id, 0, -46); ctx.restore();
        }
        function drawMenuButton(btn, text, color, isHighlighted) {
            ctx.save(); ctx.fillStyle = isHighlighted ? "#45a29e" : color; ctx.beginPath(); ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 6); ctx.fill(); ctx.strokeStyle = isHighlighted ? "#fff" : "#66fcf1"; ctx.lineWidth = isHighlighted ? 3 : 2; ctx.stroke(); ctx.fillStyle = "#fff"; ctx.font = "bold 15px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(text, btn.x + btn.w/2, btn.y + btn.h/2); ctx.restore();
        }
        function renderLoop() {
            ctx.clearRect(0, 0, 800, 400); if (globalShakeIntensity > 0) globalShakeIntensity *= 0.85;
            ctx.save(); if (globalShakeIntensity > 0.5) ctx.translate((Math.random() - 0.5) * globalShakeIntensity, (Math.random() - 0.5) * globalShakeIntensity);
            if (currentScene !== "playing") processControllerMenus();
            if (currentScene === "menu") { ctx.fillStyle = "#66fcf1"; ctx.font = "bold 38px sans-serif"; ctx.textAlign = "center"; ctx.fillText("STICKMAN SUPREME CLASH", 400, 100); drawMenuButton(menuBtnPlay, "CHOOSE MODE", "#1f2833", menuFocusIndex === 0); drawMenuButton(menuBtnSkins, "SKINS LOCKER", "#1f2833", menuFocusIndex === 1); } 
            else if (currentScene === "mode_select") { ctx.fillStyle = "#66fcf1"; ctx.font = "bold 32px sans-serif"; ctx.textAlign = "center"; ctx.fillText("SELECT MATCH MODE", 400, 110); drawMenuButton(modeBtnSolo, "SOLO vs BOT", "#1f2833", menuFocusIndex === 0); drawMenuButton(modeBtnMulti, "LOCAL 2-PLAYER", "#1f2833", menuFocusIndex === 1); drawMenuButton(modeBtnTriple, "3-PLAYER CHAOS", "#1f2833", menuFocusIndex === 2); }
            else if (currentScene === "map_select") {
                ctx.fillStyle = "#66fcf1"; ctx.font = "bold 26px sans-serif"; ctx.textAlign = "center"; ctx.fillText("SELECT BATTLEGROUND MAP", 400, 80);
                for (var m = 0; m < mapsPool.length; m++) { var cardX = 40 + (m * 250); ctx.fillStyle = (menuFocusIndex === m) ? "#45a29e" : "#1f2833"; ctx.fillRect(cardX, 160, 220, 100); ctx.strokeStyle = (menuFocusIndex === m) ? "#fff" : "#66fcf1"; ctx.lineWidth = (menuFocusIndex === m) ? 3 : 2; ctx.strokeRect(cardX, 160, 220, 100); ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center"; ctx.fillText(mapsPool[m].name, cardX + 110, 215); }
            }
            else if (currentScene === "skins") {
                ctx.fillStyle = "#66fcf1"; ctx.font = "bold 20px sans-serif"; ctx.textAlign = "center"; ctx.fillText("CONFIG OUTFIT LOCKER", 400, 35); drawMenuButton({x:140, y:60, w:140, h:28}, "P1 ACTIVE", activeSkinSelector===1?"#45a29e":"#1f2833", menuFocusIndex===6); drawMenuButton({x:320, y:60, w:140, h:28}, "P2 ACTIVE", activeSkinSelector===2?"#45a29e":"#1f2833", menuFocusIndex===7); drawMenuButton({x:500, y:60, w:140, h:28}, "P3 ACTIVE", activeSkinSelector===3?"#45a29e":"#1f2833", menuFocusIndex===8);
                for (var i = 0; i < skinOptions.length; i++) { var col = i % 3, row = Math.floor(i / 3), cardX = 140 + (col * 180), cardY = 105 + (row * 90); var isCur = (activeSkinSelector === 1 ? p1SkinIndex : activeSkinSelector === 2 ? p2SkinIndex : p3SkinIndex) === i; ctx.fillStyle = isCur ? "#45a29e" : (menuFocusIndex === i) ? "#2a3744" : "#1f2833"; ctx.fillRect(cardX, cardY, 160, 75); ctx.strokeStyle = (menuFocusIndex === i) ? "#fff" : "#66fcf1"; ctx.lineWidth = isCur ? 3 : 1; ctx.strokeRect(cardX, cardY, 160, 75); drawSkinArtSymbol(cardX + 80, cardY + 25, skinOptions[i].symbol, skinOptions[i].primary); ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.fillText(skinOptions[i].name, cardX + 80, cardY + 58); }
                drawMenuButton(skinsBtnBack, "SAVE SELECTIONS", "#1f2833", menuFocusIndex === 5);
            } 
            else if (currentScene === "playing") {
                for (var i = 0; i < platforms.length; i++) { var plat = platforms[i]; ctx.fillStyle = "#0b0c10"; ctx.fillRect(plat.x, plat.y, plat.w, plat.h); ctx.strokeStyle = plat.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(plat.x, plat.y); ctx.lineTo(plat.x + plat.w, plat.y); ctx.stroke(); }
                if (selectedMapIndex === 1 || selectedMapIndex === 2) { ctx.fillStyle = "#66fcf1"; ctx.fillRect(80, 354, 40, 6); ctx.fillRect(680, 354, 40, 6); }
                var count = (p1.hp > 0 ? 1 : 0) + (p2.hp > 0 ? 1 : 0) + (gameMode === "triple" && p3.hp > 0 ? 1 : 0);
                if (count > 1) { updateGame(); drawHUD(); } 
                else {
                    var win = (p1.hp>0) ? "PLAYER 1 WINS!" : (p2.hp>0) ? "PLAYER 2 WINS!" : "PLAYER 3 WINS!"; if (p1.hp<=0 && p2.hp<=0 && p3.hp<=0) win = "DRAW!";
                    ctx.fillStyle = "#ff4500"; ctx.font = "bold 36px sans-serif"; ctx.textAlign = "center"; ctx.fillText(win, 400, 150);
                    if (!window.resetActive) { window.resetActive = true; projectiles = []; hitParticles = []; globalShakeIntensity = 0; setTimeout(function() { currentScene = "menu"; window.resetActive = false; }, 2000); }
                }
                for (var k = 0; k < projectiles.length; k++) { var pr = projectiles[k]; ctx.fillStyle = pr.type === "ultimate" ? "#66fcf1" : pr.type === "missile" ? "#ff3333" : "#fff"; ctx.beginPath(); ctx.arc(pr.x, pr.y, pr.type === "ultimate" ? 16 : 4, 0, Math.PI * 2); ctx.fill(); }
                for (var m = 0; m < hitParticles.length; m++) { var hp = hitParticles[m]; ctx.fillStyle = hp.color; ctx.fillRect(hp.x, hp.y, hp.radius, hp.radius); }
                drawStickman(p1); drawStickman(p2); if (gameMode === "triple") drawStickman(p3);
            }
            ctx.restore(); requestAnimationFrame(renderLoop);
        }
        renderLoop();
